<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANCre</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f7f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">
  <!-- 100% width background table -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f4f7f6; padding: 20px 10px;">
    <tr>
      <td align="center">
        <!-- Main Email Container -->
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
          <!-- Header -->
          <tr>
            <td align="center" style="padding: 30px 20px; background-color: #ffffff; border-bottom: 1px solid #edf2f7;">
              <h1 style="margin: 0; color: #000000; font-size: 34px; font-family: 'Arial Black', Impact, sans-serif; font-weight: 900; letter-spacing: -2px; line-height: 1;">BANCre</h1>
            </td>
          </tr>
          <!-- Body Content -->
          <tr>
            <td style="padding: 40px 30px; color: #4a5568; font-size: 16px; line-height: 1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td align="center" style="padding: 24px 30px; background-color: #f8fafc; border-top: 1px solid #edf2f7; color: #718096; font-size: 13px;">
              <p style="margin: 0 0 10px 0;">&copy; 2026 BANCre. All rights reserved.</p>
              <p style="margin: 0;">This is an automated message &mdash; please do not reply.<br>If you have questions, contact <a href="mailto:support@bancre.com" style="color: #3182ce; text-decoration: none;">support@bancre.com</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
