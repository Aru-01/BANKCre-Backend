version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: bancre_postgres
    restart: always
    environment:
      POSTGRES_DB: bancre_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: bancre_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
